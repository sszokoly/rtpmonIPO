[project]
name = "rtpmonipo"
version = "0.1.0"
description = "Asynchronous Avaya IP Office SysMonitor RTP summary client"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rtpmonIPO"]
